  </g>
 </g>
 <g id="adversary">
  <path d="M16 40 Q-2 26 6 4 Q14 23 29 23 M48 23 Q63 23 71 4 Q79 26 61 40" fill="#981e32"/>
  <path d="M14 29 Q9 20 9 13 Q17 25 24 26 M55 26 Q63 24 68 13 Q67 23 63 29" fill="#ec6570"/>
  <path d="M17 78 Q-2 85 0 100 H77 Q78 85 59 78" fill="#981e32"/>
  <path d="M9 39 Q14 22 39 22 Q64 22 69 39 Q76 65 59 80 Q49 90 39 90 Q29 90 19 80 Q2 65 9 39 Z" fill="#dc3e51"/>
  <path d="M61 32 Q76 51 64 71 Q55 85 39 87 Q62 91 71 69 Q79 46 61 32" fill="#ba273e"/>
  <path d="M15 46 Q25 43 33 51 Q23 61 15 54 Z M63 46 Q53 43 45 51 Q55 61 63 54 Z" fill="#fff9ec"/>
  <path d="M27 48 V54 M51 48 V54" stroke="#771b30" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M14 42 L31 47 M64 42 L47 47" stroke="#771b30" stroke-width="4" stroke-linecap="round"/>
  <path d="M22 65 Q39 74 56 65 Q53 80 39 81 Q26 80 22 65 Z" fill="#771b30"/>
  <path d="M26 68 L30 76 L34 70 M44 70 L48 76 L52 68" fill="#fff9ec"/>
  <path d="M77 89 Q91 89 94 74" fill="none" stroke="#ba273e" stroke-width="7" stroke-linecap="round"/>
  <path d="M94 99 V12 M79 24 V36 Q79 47 94 47 Q109 47 109 36 V24" fill="none" stroke="#981e32" stroke-width="4" stroke-linecap="round"/>
