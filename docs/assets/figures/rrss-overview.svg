<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
<title id="title">Random Robust Secret Sharing with Perfect Privacy</title>
<desc id="desc">A secret is split into n shares. An adversary chooses up to n minus t positions, whose shares are replaced independently and uniformly at random. Identify finds at least t uncorrupted shares with probability at least one minus epsilon; SecretRecover reconstructs the secret. Any at most t minus one original shares are jointly uniform. Arbitrary adversarial replacement is a different model.</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#75859a" stroke-width="1.6"/></marker>
 <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#188375" stroke-width="1.6"/></marker>
 <pattern id="noise" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.5" fill="#df8b67" opacity=".4"/><path d="M12 12 l4 0 M14 10 l0 4" stroke="#df8b67" opacity=".4"/></pattern>
 <g id="key"><circle cx="0" cy="0" r="20" fill="none" stroke="#ca941c" stroke-width="10"/><path d="M19 0 H70 M52 0 V17 M67 0 V13" fill="none" stroke="#ca941c" stroke-width="10" stroke-linejoin="round"/></g>
