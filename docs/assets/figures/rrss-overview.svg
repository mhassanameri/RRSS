  <path d="M34 30 L54 18 Q58 16 58 21 L58 42 Q58 46 54 48 L34 60 Q30 62 30 57 L30 36 Q30 32 34 30 Z" fill="#df9371"/>
  <g fill="#82412e" stroke="none">
   <ellipse cx="20" cy="14" rx="3.5" ry="2"/><ellipse cx="38" cy="17" rx="3.5" ry="2"/>
   <ellipse cx="8" cy="26" rx="2.4" ry="3.2" transform="rotate(-24 8 26)"/><ellipse cx="22" cy="48" rx="2.4" ry="3.2" transform="rotate(-24 22 48)"/>
   <ellipse cx="15" cy="37" rx="2.4" ry="3.2" transform="rotate(-24 15 37)"/>
   <ellipse cx="38" cy="33" rx="2.4" ry="3.2" transform="rotate(24 38 33)"/><ellipse cx="50" cy="26" rx="2.4" ry="3.2" transform="rotate(24 50 26)"/>
   <ellipse cx="44" cy="39" rx="2.4" ry="3.2" transform="rotate(24 44 39)"/>
