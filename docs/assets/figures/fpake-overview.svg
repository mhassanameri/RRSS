<text x="621" y="989" font-size="18" class="muted" text-anchor="middle" font-weight="normal">n candidate shares</text>
<text x="621" y="1019" font-size="17" class="muted" text-anchor="middle" font-weight="normal">Bob does not know which shares</text>
<text x="621" y="1045" font-size="17" class="muted" text-anchor="middle">are <tspan fill="#246eb8">valid</tspan>/<tspan fill="#bd563b">invalid</tspan>. <tspan fill="#126657" font-weight="bold">RRSS</tspan> identifies them.</text>
<path d="M763 947 L809 947" fill="none" stroke="#517caa" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="837" y="919" font-size="23" class="green" text-anchor="start" font-weight="bold">RRSS</text>
<text x="837" y="952" font-size="21" class="math green" text-anchor="start" font-weight="normal">≥ t = n − ℓ valid shares</text>
<text x="837" y="987" font-size="18" class="muted" text-anchor="start" font-weight="normal">Recover the shared secret</text>
