<text x="1216" y="975" font-size="23" class="math green" text-anchor="start" font-weight="normal">Shared key K</text>
<text x="64" y="1110" font-size="19" class="" text-anchor="start" font-weight="bold">Password privacy:</text>
<text x="270" y="1110" font-size="19" class="muted" text-anchor="start" font-weight="normal">an unsuccessful guess reveals no matching positions and gives no offline password test.</text>
<text x="64" y="1142" font-size="16" class="muted" text-anchor="start" font-weight="normal">Online guessing remains possible. Share colors are illustrative.</text>
