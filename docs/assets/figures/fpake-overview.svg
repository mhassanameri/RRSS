<text x="800" y="664" font-size="26" class="math green" text-anchor="middle" font-weight="normal"><tspan fill="#c43d3d">⟨</tspan>n = 9 <tspan fill="#c43d3d">||</tspan> ℓ = 1 <tspan fill="#c43d3d">||</tspan> K<tspan baseline-shift="sub" font-size="70%">A</tspan> = K<tspan baseline-shift="sub" font-size="70%">B</tspan><tspan fill="#c43d3d">⟩</tspan></text>
<text x="64" y="715" font-size="15" class="muted" text-anchor="start" font-weight="bold">HONEST EXECUTION WITHOUT MESSAGE TAMPERING</text>
<rect x="64" y="730" width="727" height="81" rx="14" fill="#eff8f6" stroke="#d5eae4" stroke-width="2"/>
<text x="87" y="765" font-size="25" class="math green" text-anchor="start" font-weight="normal">Ham(pwd<tspan baseline-shift="sub" font-size="70%">A</tspan>, pwd<tspan baseline-shift="sub" font-size="70%">B</tspan>) ≤ ℓ</text>
<text x="87" y="792" font-size="19" class="green" text-anchor="start" font-weight="normal">Same session key, except with negligible error</text>
<rect x="810" y="730" width="726" height="81" rx="14" fill="#f8f5fc" stroke="#e5dcef" stroke-width="2"/>
<text x="833" y="765" font-size="25" class="math" text-anchor="start" font-weight="normal">Ham(pwd<tspan baseline-shift="sub" font-size="70%">A</tspan>, pwd<tspan baseline-shift="sub" font-size="70%">B</tspan>) &gt; ℓ</text>
<text x="833" y="792" font-size="19" class="muted" text-anchor="start" font-weight="normal">Independent session keys, up to negligible error</text>
<text x="64" y="860" font-size="17" class="blue" text-anchor="start" font-weight="bold">HOW RRSS ENABLES THIS CONSTRUCTION</text>
<text x="1535" y="860" font-size="16" class="muted" text-anchor="end" font-weight="normal">Construction intuition</text>
<rect x="64" y="879" width="1472" height="190" rx="18" fill="#f6f9fc" stroke="#dce6f2" stroke-width="2"/>
<text x="87" y="919" font-size="22" class="" text-anchor="start" font-weight="bold">iPAKE + share masking</text>
<text x="87" y="954" font-size="18" class="blue" text-anchor="start" font-weight="normal">Matching characters → valid share</text>
<text x="87" y="987" font-size="18" class="red" text-anchor="start" font-weight="normal">Mismatch → uniform random share</text>
