<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1176" viewBox="0 0 1600 1176" role="img" aria-labelledby="title desc">
<title id="title">Fuzzy Password-Authenticated Key Exchange</title>
<desc id="desc">Alice and Bob use close passwords to establish a shared session key over an adversarial network. Example passwords Pass#word and P@ss#word differ at one position. For honest execution, Hamming distance at most ell yields the same key except with negligible error; beyond ell the outputs are independent keys. A lower strip explains the RRSS connection: character-wise iPAKE produces valid or randomly corrupted shares, and RRSS recovers a shared secret from at least n minus ell valid shares before session-key derivation.</desc>
